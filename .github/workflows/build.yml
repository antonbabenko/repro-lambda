name: build-lambdas (reusable)

on:
  workflow_call:
    inputs:
      manifest_path:
        type: string
        default: lambdas.toml
        description: Path to lambdas.toml in the caller repo.
      repro_lambda_version:
        type: string
        required: false
        default: "0.10.0" # bump by hand on release: the release token cannot edit workflow files
        description: >-
          Exact repro-lambda release run by uvx. Defaults to the release that shipped this
          workflow, so a caller pinning `uses:` to a commit also pins the tool. Callers
          that pin anything else (e.g. a pin job's dry run) must pass the same version.
      aws_dev_role_arn:
        type: string
        required: true
        description: ARN of the dev OIDC role assumed for artifact upload. Not a secret (the security boundary is the OIDC trust policy + bucket immutability), so callers pass it as a plain input.
      aws_prod_role_arn:
        type: string
        required: false
        default: ""
        description: ARN of the prod OIDC role (master push only). Empty string disables the prod upload steps.
      dev_bucket:
        type: string
        required: true
        description: S3 bucket name for dev Lambda artifacts (set as REPRO_LAMBDA_BUCKET on the dev upload). Caller-supplied so the reusable workflow stays consumer-agnostic.
      prod_bucket:
        type: string
        required: false
        default: ""
        description: S3 bucket name for prod Lambda artifacts (master push only).
      promotion_repo:
        type: string
        required: false
        default: ""
        description: >-
          owner/repo of the centralized promotion workflow. When set, the build Step
          Summary renders a ready-to-run `gh workflow run` command per function. Generic
          by design - the reusable workflow never hardcodes a promotion target; the caller
          supplies it (keep this empty for public callers).
      promotion_workflow:
        type: string
        required: false
        default: promote-lambda.yml
        description: Workflow file name dispatched by the promotion command in the Step Summary.
      project:
        type: string
        required: false
        default: ""
        description: >-
          Project key the promotion workflow expects (-f project=...). Defaults to the
          caller repo name when empty.
    secrets:
      sources_token:
        required: false
        description: >-
          Token with read access to the private release repos referenced by any
          github_release [[lambda.source]]. Exported as REPRO_LAMBDA_SOURCES_TOKEN for the
          build. Omit when every source is a public https URL. Generic by design - the
          reusable workflow never names a consumer repo.

jobs:
  detect-arches:
    runs-on: ubuntu-24.04
    outputs:
      arches: ${{ steps.parse.outputs.arches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - id: parse
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open("${{ inputs.manifest_path }}", "rb") as f:
              data = tomllib.load(f)
          arches = sorted({l["arch"] for l in data.get("lambda", [])})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"arches={json.dumps(arches)}\n")
          PY

  build:
    needs: detect-arches
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.detect-arches.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      id-token: write
      contents: write
    env:
      # AWS, uploads and catalog commits run only for a push or a manual dispatch on the
      # caller's default branch. Every other event (pull_request, pull_request_target,
      # other branches, tags) gets no role: artifact keys are input hashes anyone with the
      # source can compute and the buckets are first-write-wins.
      TRUSTED: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      REPRO_LAMBDA_FROM: repro-lambda==${{ inputs.repro_lambda_version }}
    steps:
      # Validate before any step interpolates it (passed through env:, never inlined).
      - name: Validate repro_lambda_version
        env:
          V: ${{ inputs.repro_lambda_version }}
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::repro_lambda_version must be X.Y.Z, got '$V'"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # Content-addressed source cache, scoped per-arch (a source's sha256 is its key, so a
      # re-pin changes the manifest hash -> fresh fetch; restore-keys reuses the prior cache).
      - name: Cache fetched sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: builds/.sources-cache
          key: repro-sources-${{ matrix.arch }}-${{ hashFiles(inputs.manifest_path) }}
          restore-keys: |
            repro-sources-${{ matrix.arch }}-

      # Untrusted events never assume the dev role or write the artifact bucket (see
      # TRUSTED). A pull request only runs the local reproducibility check below. Callers
      # should also scope the role's OIDC trust to their default branch.
      - name: Configure AWS credentials (dev)
        if: env.TRUSTED == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_dev_role_arn }}
          aws-region: eu-west-1

      - name: Build (dev bucket)
        if: env.TRUSTED == 'true'
        env:
          REPRO_LAMBDA_BUCKET: ${{ inputs.dev_bucket }}
          REPRO_LAMBDA_SOURCES_TOKEN: ${{ secrets.sources_token }}
        run: uvx --from "$REPRO_LAMBDA_FROM" repro-lambda build --manifest "${{ inputs.manifest_path }}" --arch "${{ matrix.arch }}" --reproduce-cache-hits --json-out "$RUNNER_TEMP/build-summary.json"

      # Render the dev build's content shas + a copy-paste promotion command per function
      # into the run's Step Summary (the build JSON is otherwise buried in step logs).
      # NB: the JSON lives in RUNNER_TEMP (outside the workspace), so hashFiles() can't guard
      # it - run on success() and skip inside the script if the file is somehow absent.
      # The build JSON carries each artifact's zip_sha256 / code_sha256: bytes this run
      # built, or rebuilt and matched (--reproduce-cache-hits), never a writer's record.
      # A caller's pin job downloads it to pin those bytes, not just the input-hash key.
      - name: Upload build summary (pin input)
        if: env.TRUSTED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-lambda-build-summary-${{ matrix.arch }}
          path: ${{ runner.temp }}/build-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Build summary (content shas + promote commands)
        if: success() && env.TRUSTED == 'true'
        env:
          SUMMARY_JSON: ${{ runner.temp }}/build-summary.json
          PROMOTION_REPO: ${{ inputs.promotion_repo }}
          PROMOTION_WORKFLOW: ${{ inputs.promotion_workflow }}
          PROJECT: ${{ inputs.project != '' && inputs.project || github.event.repository.name }}
          ARCH: ${{ matrix.arch }}
          SRC_REPO: ${{ github.repository }}
          SRC_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = os.environ["SUMMARY_JSON"]
          if not os.path.exists(path):
              print(f"::notice::no build summary JSON at {path}; skipping summary.")
              sys.exit(0)
          rows = json.load(open(path))
          repo = os.environ["PROMOTION_REPO"]
          wf = os.environ["PROMOTION_WORKFLOW"]
          project = os.environ["PROJECT"]
          arch = os.environ["ARCH"]
          src = os.environ["SRC_REPO"]
          commit = os.environ["SRC_COMMIT"]

          out = [
              f"## Lambda build ({arch})",
              "",
              f"Source: `{src}` @ `{commit[:12]}`",
              "",
              "| Function | Outcome | Content SHA | Dev key |",
              "| --- | --- | --- | --- |",
          ]
          for r in rows:
              out.append(
                  f"| `{r['logical_name']}` | {r['outcome']} | `{r['sha256']}` | `{r['bucket_key']}` |"
              )
          out += [
              "",
              "### Pipeline",
              "",
              "1. **Build** (this run) - artifacts uploaded to the dev bucket, keyed by content sha.",
              "2. **Pin dev** - point the dev stack's lambda pin at the sha below, then apply dev and test.",
              "3. **Promote to prod** - run the promote command below (copies dev -> prod by content"
              " sha + opens the prod-pin PR), then apply prod.",
              "",
              "### Per-function",
              "",
          ]
          for r in rows:
              fn, sha = r["logical_name"], r["sha256"]
              out += [f"**`{fn}`** - content sha `{sha}`", "", f"- dev pin: `{fn} = \"{sha}\"`"]
              if repo:
                  out += [
                      "- promote to prod:",
                      "```bash",
                      f"gh workflow run {wf} --repo {repo} "
                      f"-f project={project} -f function={fn} -f sha={sha}",
                      "```",
                  ]
              out += [""]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          PY

      - name: Verify reproducible (PR only)
        if: github.event_name == 'pull_request'
        run: uvx --from "$REPRO_LAMBDA_FROM" repro-lambda build --manifest "${{ inputs.manifest_path }}" --arch "${{ matrix.arch }}" --verify --dry-run

      - name: Configure AWS credentials (prod)
        if: env.TRUSTED == 'true' && inputs.aws_prod_role_arn != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.aws_prod_role_arn }}
          aws-region: eu-west-1

      - name: Build (prod bucket)
        if: env.TRUSTED == 'true' && inputs.aws_prod_role_arn != ''
        env:
          REPRO_LAMBDA_BUCKET: ${{ inputs.prod_bucket }}
          REPRO_LAMBDA_SOURCES_TOKEN: ${{ secrets.sources_token }}
        run: uvx --from "$REPRO_LAMBDA_FROM" repro-lambda build --manifest "${{ inputs.manifest_path }}" --arch "${{ matrix.arch }}" --reproduce-cache-hits

      - name: Commit catalog drift (default branch only, dev bot)
        if: env.TRUSTED == 'true'
        run: |
          if [[ -n "$(git status --porcelain builds/catalog.json)" ]]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add builds/catalog.json
            git commit -m "chore(catalog): auto-update after build [skip ci]"
            git push
          fi
